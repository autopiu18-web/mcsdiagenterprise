name: Build Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - init-mcsdiagenterprise

# Force Actions JS to Node 24 to avoid deprecation issues
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build_windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Disable npm audit/fund messages
        run: |
          npm config set fund false
          npm config set audit false

      - name: Ensure NSIS is installed (for electron-builder)
        run: |
          choco install nsis -y || echo "NSIS already installed"
        shell: powershell

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: |
          npm ci --no-audit --no-fund

      - name: Build renderer and main
        working-directory: ./desktop
        run: |
          npm run build

      - name: Package Windows portable EXE (electron-builder)
        working-directory: ./desktop
        run: |
          npm run dist:portable

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcs-desktop-windows
          path: |
            desktop/release/**
            desktop/dist/**/
